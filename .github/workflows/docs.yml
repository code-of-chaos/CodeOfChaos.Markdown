name: Documentation

on:
  push:
    branches:
      - core
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Install DocFX .NET tool (latest)
        run: |
          dotnet tool install --global docfx || dotnet tool update --global docfx
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      # Build API metadata and the static site from docs/docfx.json.
      - name: Build documentation site
        run: docfx docs/docfx.json

      # Configure the workflow environment for GitHub Pages deployment.
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      # Upload the generated static site as a Pages artifact.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

      # Deploy docs/_site to GitHub Pages.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
